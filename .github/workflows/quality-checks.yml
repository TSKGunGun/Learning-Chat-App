name: Quality Checks

on:
  pull_request:
    paths:
      - "ui/**"
      - "api/**"
      - "package.json"
      - ".github/workflows/quality-checks.yml"
  push:
    branches:
      - main
    paths:
      - "ui/**"
      - "api/**"
      - "package.json"
      - ".github/workflows/quality-checks.yml"

permissions:
  contents: read

jobs:
  quality-checks:
    name: ${{ matrix.project }} quality checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - ui
          - api
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix ${{ matrix.project }}

      - name: Run root quality script
        run: npm run check:${{ matrix.project }}
